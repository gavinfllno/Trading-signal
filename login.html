<!DOCTYPE html>
<html>
<head>
    <title>Login Simple</title>
    <style>
        body { background: #1e3c72; color: white; padding: 20px; }
        input, button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username" value="trader">
    <input type="password" id="password" placeholder="Password" value="123">
    <button onclick="login()">Login</button>
    
    <script>
        function login() {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('username', 'trader');
            alert('Login berhasil!');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
